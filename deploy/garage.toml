# Garage als Ein-Knoten-Speicher. rpc_secret/admin_token kommen aus der
# Umgebung (GARAGE_RPC_SECRET/GARAGE_ADMIN_TOKEN, /opt/sanime/env/infra.env).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# Muss zu STORAGE_REGION der Umgebungen passen.
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
